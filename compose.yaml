name: trade-system

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores data in a version-specific subdirectory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Trade.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # API has no host port; trust the private Docker proxy network. Override for a custom Docker CIDR.
      ReverseProxy__KnownNetworks__0: ${REVERSE_PROXY_KNOWN_NETWORK:-172.16.0.0/12}
      ConnectionStrings__TradeDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-trade};Username=${POSTGRES_USER:-trade};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Timeout=5;Command Timeout=5"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data_protection:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  caddy:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      NO_PROXY: api,localhost,127.0.0.1
      no_proxy: api,localhost,127.0.0.1
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    depends_on:
      api:
        condition: service_started
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  data_protection:
  caddy_data:
  caddy_config:
